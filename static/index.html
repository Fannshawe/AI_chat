<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Persona Chat</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260813a">
  <script defer src="/static/index.js?v=20260813b"></script>
</head>
<body class="chat-page">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>Persona Chat</strong><small>像你一样聊天</small></div></div>
      <div class="section-label">当前会话</div>
      <button class="contact active" id="contactButton"><span class="avatar">TA</span><span><b id="contactName">聊天对象</b><small>长期记忆已开启</small></span></button>
      <div class="sidebar-bottom">
        <button class="ghost full" id="proactiveButton">✦ 生成主动聊天草稿</button>
        <div class="debug-tools">
          <label class="debug-toggle"><span>记录详细 Debug</span><input id="debugEnabledToggle" type="checkbox"></label>
          <a class="debug-link hidden" id="latestDebugLink" href="/debug">查看刚刚这次 Debug</a>
          <p class="debug-note">关闭后只保留节点名、耗时、warning 和 error。</p>
        </div>
        <a class="ghost full center" href="/debug">查看 Debug 面板</a>
        <a class="ghost full center" href="/admin">⚙ 进入管理后台</a>
        <a class="ghost full center" href="/gateway/admin">实例管理页</a>
        <button class="ghost full" id="logoutButton" type="button">退出登录</button>
        <p class="privacy-note">数据保存在本机 SQLite 中，候选回复只有确认后才会记为已发送。</p>
      </div>
    </aside>

    <main class="conversation">
      <header class="topbar">
        <div><h1 id="chatTitle">聊天对象</h1><p>AI 生成候选 · 由你确认发送</p></div>
        <span class="status-pill" id="relationshipBadge">关系：认识</span>
      </header>
      <section class="messages" id="messages" aria-live="polite" aria-relevant="additions"></section>
      <section class="draft-zone hidden" id="draftZone">
        <div class="strategy"><span>聊天指导</span><p id="strategyText"></p></div>
        <div class="candidate-grid" id="candidateGrid"></div>
      </section>
      <section class="composer-wrap">
        <div class="generation-progress hidden" id="generationProgress" aria-live="polite">
          <div class="generation-progress-head">
            <strong id="progressStageText">准备中</strong>
            <span id="progressPercentText">0%</span>
          </div>
          <div class="generation-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="回复生成进度">
            <span id="progressFill"></span>
          </div>
        </div>
        <div class="composer">
          <textarea id="messageInput" rows="1" placeholder="粘贴对方发来的消息，按 Enter 换行…"></textarea>
          <button class="primary" id="generateButton">生成 3 个回复</button>
        </div>
        <p class="composer-hint">Enter 换行 · 点击按钮生成 3 个回复 · 当前不连接外部聊天平台</p>
      </section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
