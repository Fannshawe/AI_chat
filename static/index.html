<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Persona Chat</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260731a">
  <style>
    .candidate-mode{justify-self:start;background:#f5f1ec;color:#655f58;border-radius:99px;padding:3px 8px;font-size:10px;font-weight:700}
    .candidate-warning{margin:0;color:#a55a23;background:#fff0db;border-radius:8px;padding:7px 9px;font-size:11px;line-height:1.45}
    .debug-tools{display:grid;gap:8px;padding:10px 8px;border:1px solid #e8e1d8;border-radius:14px;background:#fffaf4}
    .debug-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#5d5954}
    .debug-toggle input{width:16px;height:16px}
    .debug-link{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:10px;background:#fff0db;color:#a55a23;text-decoration:none;font-size:12px;font-weight:700}
    .debug-link.hidden{display:none}
    .debug-note{margin:0;font-size:11px;line-height:1.5;color:#77736d}
  </style>
  <script defer src="/static/index.js?v=20260731b"></script>
</head>
<body class="chat-page">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">P</span><div><strong>Persona Chat</strong><small>像你一样聊天</small></div></div>
      <div class="section-label">当前会话</div>
      <button class="contact active" id="contactButton"><span class="avatar">TA</span><span><b id="contactName">聊天对象</b><small>长期记忆已开启</small></span></button>
      <div class="sidebar-bottom">
        <button class="ghost full" id="proactiveButton">✦ 生成主动聊天草稿</button>
        <div class="debug-tools">
          <label class="debug-toggle"><span>记录详细 Debug</span><input id="debugEnabledToggle" type="checkbox"></label>
          <a class="debug-link hidden" id="latestDebugLink" href="/debug">查看刚刚这次 Debug</a>
          <p class="debug-note">关闭后只保留节点名、耗时、warning 和 error。</p>
        </div>
        <a class="ghost full center" href="/debug">查看 Debug 面板</a>
        <a class="ghost full center" href="/admin">⚙ 进入管理后台</a>
        <p class="privacy-note">数据保存在本机 SQLite 中，候选回复只有确认后才会记为已发送。</p>
      </div>
    </aside>

    <main class="conversation">
      <header class="topbar">
        <div><h1 id="chatTitle">聊天对象</h1><p>AI 生成候选 · 由你确认发送</p></div>
        <span class="status-pill" id="relationshipBadge">关系：认识</span>
      </header>
      <section class="messages" id="messages" aria-live="polite"></section>
      <section class="draft-zone hidden" id="draftZone">
        <div class="strategy"><span>聊天指导</span><p id="strategyText"></p></div>
        <div class="candidate-grid" id="candidateGrid"></div>
      </section>
      <section class="composer-wrap">
        <div class="image-preview" id="imagePreview"></div>
        <div class="composer">
          <label class="icon-button" title="添加图片">＋<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden></label>
          <textarea id="messageInput" rows="1" placeholder="粘贴对方发来的消息，Enter 生成…"></textarea>
          <button class="primary" id="generateButton">生成 3 个回复</button>
        </div>
        <p class="composer-hint">Shift + Enter 换行 · 支持最多 4 张图片 · 当前不连接外部聊天平台</p>
      </section>
    </main>
  </div>
  <div class="toast" id="toast"></div>
</body>
</html>
