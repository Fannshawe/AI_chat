services:
  - type: web
    name: chat-langchain
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/bootstrap
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: CHAT_DATA_DIR
        value: /var/data
      - key: WORKFLOW_DEBUG
        value: false
      - key: CRITIC_MAX_ATTEMPTS
        value: 3
    disk:
      name: chat-langchain-data
      mountPath: /var/data
      sizeGB: 5